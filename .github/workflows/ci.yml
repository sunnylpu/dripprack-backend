name: Backend CI & Production Health Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Backend Test Suite & Environment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: '*'
      COOKIE_SECRET: test_cookie_secret_at_least_32_characters_long_for_security
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: false
      MONGODB_URI: mongodb://localhost:27017/driprack_test
      JWT_ACCESS_SECRET: test_jwt_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_at_least_32_characters_long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      PAYMENT_PROVIDER: dodo
      DODO_PAYMENTS_API_KEY: dodo_test_mock_key
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 300
      RATE_LIMIT_AUTH_MAX_REQUESTS: 1000
      CURRENCY_CODE: USD
      TAX_RATE_PERCENT: 0
      SHIPPING_FLAT_FEE_CENTS: 500
      FREE_SHIPPING_THRESHOLD_CENTS: 5000
      ENABLE_ONLINE_PAYMENTS: true
      LOG_LEVEL: info

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Test Environment Variables (.env)
        run: |
          cat << 'EOF' > .env
          NODE_ENV=test
          PORT=5000
          API_PREFIX=/api/v1
          CORS_ORIGIN=*
          COOKIE_SECRET=test_cookie_secret_at_least_32_characters_long_for_security
          COOKIE_SAME_SITE=lax
          COOKIE_SECURE=false
          MONGODB_URI=mongodb://localhost:27017/driprack_test
          JWT_ACCESS_SECRET=test_jwt_access_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET=test_jwt_refresh_secret_at_least_32_characters_long
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN_DAYS=7
          PAYMENT_PROVIDER=dodo
          DODO_PAYMENTS_API_KEY=dodo_test_mock_key
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=300
          RATE_LIMIT_AUTH_MAX_REQUESTS=1000
          CURRENCY_CODE=USD
          TAX_RATE_PERCENT=0
          SHIPPING_FLAT_FEE_CENTS=500
          FREE_SHIPPING_THRESHOLD_CENTS=5000
          ENABLE_ONLINE_PAYMENTS=true
          LOG_LEVEL=info
          EOF

      - name: Validate Environment Schema
        run: node -e "import('./src/config/env.js').then(() => console.log('✅ Environment configuration schema is valid.'))"

      - name: Run Vitest Test Suite
        run: npm test

  verify-live-deployment:
    name: Verify Render Production Health
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for Render auto-deployment
        run: sleep 35

      - name: Poll Live Health Endpoint
        run: |
          for i in {1..12}; do
            echo "Attempt $i: Checking https://dripprack-backend.onrender.com/health..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dripprack-backend.onrender.com/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Live Backend is healthy and responding (HTTP 200)!"
              curl -s https://dripprack-backend.onrender.com/health
              echo ""
              exit 0
            fi
            echo "Status: $STATUS. Retrying in 10s..."
            sleep 10
          done
          echo "❌ Timed out waiting for live backend health probe"
          exit 1
